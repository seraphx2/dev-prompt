name: Release

# Fires on every push to main — i.e. every dev->main merge — and publishes a
# release: a CalVer version from today's date + existing tags, the Windows NSIS
# installer and signed updater artifacts, and a GitHub Release with everything
# attached. Doc-only merges are skipped (paths-ignore); to opt a code merge out,
# put "[skip release]" in the merge-commit message. workflow_dispatch stays for
# manual drafts / prereleases / re-runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as a draft (review, then publish by hand)"
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release (auto-updater ignores it)"
        type: boolean
        default: false

# One release at a time; never cancel a run that may have already published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # push: skip when the merge commit opts out. dispatch: always run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')

    steps:
      - name: Guard — live dispatch only from main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" != "main" ] \
            && [ "${{ inputs.draft }}" != "true" ] \
            && [ "${{ inputs.prerelease }}" != "true" ]; then
            echo "::error::Refusing a live release dispatched from '${{ github.ref_name }}'. Check 'draft' or 'prerelease', or dispatch from main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need all tags so the CalVer build segment is correct

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Branch protection is strict:false, so the PR's `check` ran on the PR head,
      # not the merge result. Re-run the suite on the actual commit being shipped.
      - name: Test
        shell: bash
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compute version
        id: version
        shell: bash
        run: echo "value=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.value }}
          releaseName: dev-prompt v${{ steps.version.outputs.value }}
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          includeUpdaterJson: true

      - name: Package portable zip
        shell: bash
        run: |
          cd src-tauri/target/release
          7z a "dev-prompt_${{ steps.version.outputs.value }}_x64-portable.zip" dev-prompt.exe

      - name: Attach portable zip to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.version.outputs.value }}" \
            "src-tauri/target/release/dev-prompt_${{ steps.version.outputs.value }}_x64-portable.zip" \
            --clobber

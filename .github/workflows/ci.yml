name: CI

# The dev->main PR gate. The `check` job name is the required status check
# on main (branch protection, enforce_admins on) — keep it stable.
on:
  pull_request:
    branches: [main]

# Newer commits on the PR branch supersede an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build + test
        uses: ./.github/actions/ci

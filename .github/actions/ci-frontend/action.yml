name: CI — frontend
description: >
  Tauri npm/crate version match, npm ci, svelte-check + vite build, and the
  vitest unit suite. Runs on Linux, in parallel with the Rust job. Assumes the
  repo is already checked out.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # `tauri build` refuses mismatched npm/crate pairs, and only the release
    # runs it — so check here, on the PR. Reads the lockfiles; no install.
    - name: Tauri npm and crate versions match
      shell: bash
      run: node scripts/check-tauri-versions.mjs

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build + typecheck
      shell: bash
      run: npm run build

    - name: Unit tests
      shell: bash
      run: npm test

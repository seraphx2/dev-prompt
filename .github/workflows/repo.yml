name: Repo

# Publishes the self-hosted apt + rpm + pacman + Flatpak repository to the
# gh-pages branch (served at https://seraphx2.github.io/dev-prompt/). Runs when a
# GitHub Release is published — draft releases don't trigger it.
# workflow_dispatch re-runs it against an existing tag. See
# docs/linux-distribution/phase-3-apt-rpm-repo.md and phase-4-flatpak.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v2026.905.1"
        required: true

# One publish at a time; never cancel a run that may have pushed a partial tree.
concurrency:
  group: repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Repackage the release .deb into a native pacman package. Separate job so it
  # can run in an Arch container; the result is handed to `publish` as an artifact.
  pacman-pkg:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Base tools
        run: pacman -Sy --noconfirm --needed base-devel git

      - uses: actions/checkout@v7

      - name: Resolve version
        id: v
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: makepkg
        shell: bash
        run: |
          set -eux
          v="${{ steps.v.outputs.value }}"
          useradd -m builder
          install -d -o builder -g builder /tmp/build
          # In our own repo the package is just `dev-prompt` (the -bin split and
          # its provides/conflicts are an AUR convention for coexisting variants).
          cp packaging/arch/PKGBUILD-bin /tmp/build/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$v/; s/^pkgname=.*/pkgname=dev-prompt/; /^provides=/d; /^conflicts=/d" \
            /tmp/build/PKGBUILD
          chown -R builder:builder /tmp/build
          # PKGBUILD-bin keeps sha256sums=('SKIP'); the source is our own release
          # over HTTPS. --nodeps: we're only repackaging the prebuilt .deb.
          su builder -c 'cd /tmp/build && makepkg --noconfirm --nodeps --clean'
          mkdir -p out && cp /tmp/build/*.pkg.tar.zst out/

      - uses: actions/upload-artifact@v7
        with:
          name: pacman-pkg
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  # Build the Flatpak from packaging/flatpak/ and bake it into a GPG-signed
  # OSTree repo, handed to `publish` as a tarball. Runs inside the flathub-infra
  # flatpak-github-actions container (matched to runtime-version '50') so
  # flatpak-builder + the shared-modules ayatana chain behave exactly as they do
  # for Flathub — the bare ubuntu runner's newer SDK installed cmake modules to
  # /app/lib64 and broke the tray chain. Heavy (~30 min: SDK + full cargo/vite
  # build) and best-effort — if it fails, `publish` still ships the apt/rpm/
  # pacman trees and leaves the last Flatpak repo in place.
  flatpak-repo:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged # flatpak-builder's bwrap sandbox needs it
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the tagged tree (the manifest is `type: dir` on the checkout,
          # not a release artifact). shared-modules is a submodule.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive

      - name: Resolve version
        id: v
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # The build module cache (cargo compile + fetched sources) is the real time
      # sink; the container already carries the GNOME 50 SDK.
      - name: Cache flatpak-builder state
        uses: actions/cache@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-gnome50-${{ hashFiles('packaging/flatpak/io.github.seraphx2.devprompt.yaml', 'src-tauri/Cargo.lock', 'package-lock.json') }}
          restore-keys: flatpak-builder-gnome50-

      - name: Import signing key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          echo "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long

      # Same swap release.yml does: the checked-in metainfo carries a 0.0.0
      # placeholder <release>; give the bundled AppStream data the real one.
      - name: Stamp AppStream release entry
        run: |
          f=packaging/linux/io.github.seraphx2.devprompt.metainfo.xml
          sed -i \
            "s|<release version=\"0.0.0\" date=\"1970-01-01\"/>|<release version=\"${{ steps.v.outputs.value }}\" date=\"$(date -u +%Y-%m-%d)\"/>|" \
            "$f"
          grep -A2 '<releases>' "$f"

      - name: Build + sign the Flatpak repo
        run: |
          flatpak-builder --user --install-deps-from=flathub \
            --repo=flatpak-repo --gpg-sign=E3C07CD21A9A9BA5 \
            --force-clean --disable-rofiles-fuse \
            build-dir packaging/flatpak/io.github.seraphx2.devprompt.yaml
          flatpak build-update-repo --gpg-sign=E3C07CD21A9A9BA5 \
            --generate-static-deltas --prune --prune-depth=20 \
            flatpak-repo
          tar -cf flatpak-repo.tar -C flatpak-repo .

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-repo
          path: flatpak-repo.tar
          if-no-files-found: error

  publish:
    needs: [pacman-pkg, flatpak-repo]
    # flatpak-repo is best-effort; pacman-pkg is not.
    if: always() && needs.pacman-pkg.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "value=${tag#v}"      >> "$GITHUB_OUTPUT"

      - name: Repo tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils createrepo-c gnupg rpm

      - name: Fetch release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ steps.v.outputs.tag }}" \
            -p '*_amd64.deb' -p '*.x86_64.rpm' -D artifacts
          ls -l artifacts

      - uses: actions/download-artifact@v8
        with:
          name: pacman-pkg
          path: artifacts

      - name: Fetch Flatpak repo
        if: needs.flatpak-repo.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: flatpak-repo
          path: flatpak-in

      - name: Import signing key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          echo "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long

      - name: Check out gh-pages worktree
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add site origin/gh-pages
          else
            git worktree add --detach site
            git -C site switch --orphan gh-pages
            git -C site rm -rf --quiet . 2>/dev/null || true
          fi

      # Wholesale-replace site/flatpak with the freshly built OSTree repo (it is
      # already signed + summary-updated). Only when flatpak-repo succeeded —
      # otherwise the previous Flatpak repo in the gh-pages checkout stands.
      - name: Place Flatpak repo
        if: needs.flatpak-repo.result == 'success'
        run: |
          rm -rf site/flatpak
          mkdir -p site/flatpak
          tar -xf flatpak-in/flatpak-repo.tar -C site/flatpak

      - name: Rebuild repository
        run: packaging/repo/build-repo.sh artifacts site E3C07CD21A9A9BA5

      - name: Publish gh-pages
        run: |
          cd site
          git add -A
          git commit -m "repo: ${{ steps.v.outputs.tag }}" || { echo "nothing to publish"; exit 0; }
          git push --force origin HEAD:gh-pages

# dev-prompt bundled defaults.
#
# Embedded in the binary. Two user files layer on top:
#   config.yaml (Settings screen)  — hotkey / roots / scan / cache_ttl_secs: replace
#                                    docs/configuration.md
#   rules.yaml  (hand-authored)    — markers  : appended (markers_replace: true to reset)
#                                    programs : merged by key
#                                    rules    : prepended; rules_disable: [id] drops built-ins
#                                    universal: universal.disable / .add / .default
#                                    docs/rules-engine.md
#
# Every rules[].match also acts as a discovery marker, so adding a rule for an
# ecosystem makes those repos show up in the list as well as gain actions.
#
# Gating: `requires: [bin]` hides a rule unless `bin` is on PATH (PATHEXT-aware).
#         `needs: [key]` hides an action unless that `programs` key resolves.
# Nothing here breaks when a tool is absent — it just doesn't appear.
#
# Template variables usable in rule/universal actions:
#   {{path}}  project dir      {{repo}} repo root       {{rel}} sub-project path
#   {{name}}  project/repo name {{file}} matched file    {{file.name}} {{file.stem}}
#   {{env:VAR}}                 {{<program-key>}} a resolved program

hotkey: CmdOrCtrl+Shift+Space
# Second global hotkey — opens straight into the ">" app launcher. Same key as
# ">". Set to "" in config.yaml (or "turn off" in Settings) to disable it.
apps_hotkey: CmdOrCtrl+Shift+Period
roots: []
scan:
  max_depth: 4
  # A repo found inside another repo:
  #   true  (default) — drop it (hides submodules, vendored trees, workspace members)
  #   false           — list every one separately
  #   auto            — drop it unless it looks independent: a real `.git` dir
  #                     (not a submodule/worktree `.git` file), not in the
  #                     ancestor's .gitmodules, not under vendor/ third_party/ …
  collapse_nested: true
cache_ttl_secs: 900

# --- installed-app launcher (the ">" scope in the search bar) ---------------
# Type ">" in the overlay to search installed apps instead of repos. Windows
# only for now. Discovery unions Start Menu shortcuts, Store apps, the Uninstall
# registry entries, and a bounded *.exe scan of %LOCALAPPDATA%\Programs.
apps:
  enabled: true
  # Extra folders to scan for portable / unregistered executables.
  extra_dirs: []
  # Drop any app whose name or path contains one of these (case-insensitive).
  exclude: []

# --- discovery markers -------------------------------------------------------
# VCS dirs + workspace files with no distinct actions. Build manifests
# (pom.xml, Gemfile, …) ride in via their rule's `match` instead.
markers:
  - { name: .git, kind: vcs, label: Git }
  - { name: .hg, kind: vcs, label: Mercurial }
  - { name: .jj, kind: vcs, label: Jujutsu }
  - { name: .svn, kind: vcs, label: Subversion }
  - { name: .bzr, kind: vcs, label: Bazaar }
  - { name: _darcs, kind: vcs, label: Darcs }
  - { name: .fslckout, kind: vcs, label: Fossil }
  - "*.sln"
  - package.json
  - pnpm-workspace.yaml
  - "*.code-workspace"
  - Cargo.toml
  - go.mod
  - pyproject.toml
  - requirements.txt

# --- program resolution ----------------------------------------------------
programs:
  vs:
    windows:
      - vswhere: "-latest -prerelease -products * -property productPath"
      - "%ProgramFiles%/Microsoft Visual Studio/*/*/Common7/IDE/devenv.exe"
      - "%ProgramFiles(x86)%/Microsoft Visual Studio/*/*/Common7/IDE/devenv.exe"
  rider:
    any: [rider]
    windows:
      - "%LOCALAPPDATA%/Programs/*Rider*/bin/rider64.exe"
      - "%LOCALAPPDATA%/JetBrains/Toolbox/scripts/rider.cmd"
  code:
    any: [code]
    windows: [code.cmd]
  claude:
    any: [claude]
    windows: [claude.cmd]

  # AI coding CLIs (terminal agents). npm-published ones expose a `.cmd` shim on
  # Windows; the pip / Go / native ones just land on PATH. Missing tool -> the
  # matching "Launch …" action is hidden.
  aider:
    any: [aider]
  amazonq:
    any: [q]
  codex:
    any: [codex]
    windows: [codex.cmd]
  crush:
    any: [crush]
  cursoragent:
    any: [cursor-agent]
  gemini:
    any: [gemini]
    windows: [gemini.cmd]
  copilot:
    any: [copilot]
    windows: [copilot.cmd]
  goose:
    # Collides with pressly/goose (the DB-migration tool): if that's the `goose`
    # on PATH, "Launch Goose" runs it instead.
    any: [goose]
  opencode:
    any: [opencode]
    windows: [opencode.cmd]
  qwen:
    any: [qwen]
    windows: [qwen.cmd]

  # editors
  cursor:
    any: [cursor]
    windows:
      - "%LOCALAPPDATA%/Programs/cursor/Cursor.exe"
  windsurf:
    any: [windsurf]
    windows:
      - "%LOCALAPPDATA%/Programs/Windsurf/Windsurf.exe"
  trae:
    any: [trae]
    windows:
      - "%LOCALAPPDATA%/Programs/Trae/Trae.exe"
  codium:
    any: [codium]
    windows:
      - codium.cmd
      - "%LOCALAPPDATA%/Programs/VSCodium/bin/codium.cmd"
      - "%ProgramFiles%/VSCodium/bin/codium.cmd"
  lapce:
    any: [lapce]
    windows:
      - "%LOCALAPPDATA%/Programs/Lapce/lapce.exe"
      - "%ProgramFiles%/Lapce/lapce.exe"
  pulsar:
    any: [pulsar]
    windows:
      - "%LOCALAPPDATA%/Programs/Pulsar/Pulsar.exe"
  zed:
    any: [zed]
    windows:
      - "%LOCALAPPDATA%/Programs/Zed/Zed.exe"
  subl:
    any: [subl]
    windows:
      - "%ProgramFiles%/Sublime Text/subl.exe"
      - "%ProgramFiles%/Sublime Text 3/subl.exe"
  idea:
    any: [idea]
    windows:
      - "%LOCALAPPDATA%/JetBrains/Toolbox/scripts/idea.cmd"
      - "%ProgramFiles%/JetBrains/IntelliJ IDEA*/bin/idea64.exe"
  webstorm:
    any: [webstorm]
    windows:
      - "%LOCALAPPDATA%/JetBrains/Toolbox/scripts/webstorm.cmd"
      - "%ProgramFiles%/JetBrains/WebStorm*/bin/webstorm64.exe"
  pycharm:
    any: [pycharm]
    windows:
      - "%LOCALAPPDATA%/JetBrains/Toolbox/scripts/pycharm.cmd"
      - "%ProgramFiles%/JetBrains/PyCharm*/bin/pycharm64.exe"
  goland:
    any: [goland]
    windows:
      - "%LOCALAPPDATA%/JetBrains/Toolbox/scripts/goland.cmd"
      - "%ProgramFiles%/JetBrains/GoLand*/bin/goland64.exe"

  # git GUIs
  fork:
    windows:
      - "%LOCALAPPDATA%/Fork/Fork.exe"
  gitkraken:
    windows:
      - "%LOCALAPPDATA%/gitkraken/app-*/gitkraken.exe"
  smerge:
    any: [smerge]
    windows:
      - "%ProgramFiles%/Sublime Merge/smerge.exe"
  lazygit:
    any: [lazygit]

  # Eclipse-family IDEs — ship as zips, so install paths vary wildly.
  # Expect users to pin an absolute path in config.yaml.
  anypoint:
    any: [AnypointStudio]
    windows:
      - "%USERPROFILE%/AnypointStudio/AnypointStudio.exe"
      - "C:/AnypointStudio/AnypointStudio.exe"
  eclipse:
    any: [eclipse]
    windows:
      - "%USERPROFILE%/eclipse/*/eclipse.exe"
      - "C:/eclipse/eclipse.exe"
  sts:
    any: [SpringToolSuite4]
    windows:
      - "%USERPROFILE%/sts-*/SpringToolSuite4.exe"
      - "%USERPROFILE%/springtoolsuite4/SpringToolSuite4.exe"

  terminal:
    windows: [wt.exe, alacritty, wezterm]
    linux:
      [alacritty, kitty, wezterm, foot, gnome-terminal, konsole, xfce4-terminal, x-terminal-emulator, xterm]
    macos: [open]
  filemanager:
    windows: [explorer.exe]
    linux: [xdg-open]
    macos: [open]

# --- rules ---------------------------------------------------------------
rules:
  - id: sln-editors
    match: "*.sln"
    when: windows
    per_file: true
    actions:
      - name: "Open {{file.stem}} in Visual Studio"
        program: "{{vs}}"
        args: ["{{file}}"]
        needs: [vs]
        icon: vs
      - name: "Open {{file.stem}} in Rider"
        program: "{{rider}}"
        args: ["{{file}}"]
        needs: [rider]
        icon: rider

  - id: csproj-editors
    match: ["*.csproj", "*.fsproj"]
    when: windows
    per_file: true
    actions:
      - name: "Open {{file.stem}} in Visual Studio"
        program: "{{vs}}"
        args: ["{{file}}"]
        needs: [vs]
        icon: vs
      - name: "Open {{file.stem}} in Rider"
        program: "{{rider}}"
        args: ["{{file}}"]
        needs: [rider]
        icon: rider

  # Terminal build/run per project in a solution (or a lone project file),
  # cross-platform. Sits alongside the editor rules above.
  - id: dotnet
    match: ["*.sln", "*.slnx", "*.csproj", "*.vbproj", "*.fsproj"]
    provider: dotnet
    requires: [dotnet]

  - id: node
    match: package.json
    provider: npm-scripts

  - id: cargo
    match: Cargo.toml
    provider: cargo

  - id: go
    match: [go.mod, go.work]
    provider: go

  # Per-module `go build` / `go test` for each `use` in a go.work workspace.
  - id: go-work
    match: go.work
    provider: go-work
    requires: [go]

  - id: python
    match: [pyproject.toml, requirements.txt, setup.py, setup.cfg, Pipfile, manage.py]
    provider: python

  - id: compose
    match: [docker-compose.yml, docker-compose.yaml, compose.yml, compose.yaml]
    scope: repo
    provider: compose

  # --- build tools: gated on the CLI, run in a terminal --------------------
  - id: maven
    match: pom.xml
    requires: [mvn]
    actions:
      - { name: "mvn compile", run: "mvn -B compile", terminal: true, icon: java }
      - { name: "mvn test", run: "mvn -B test", terminal: true, icon: java }
      - { name: "mvn package", run: "mvn -B package", terminal: true, icon: java }

  # Per-module compile/test for a reactor pom's <modules>.
  - id: maven-modules
    match: pom.xml
    provider: maven-modules
    requires: [mvn]

  - id: gradle
    match: [build.gradle, build.gradle.kts]
    requires: [gradle]
    actions:
      - { name: "gradle build", run: "gradle build", terminal: true, icon: gradle }
      - { name: "gradle test", run: "gradle test", terminal: true, icon: gradle }
      - { name: "gradle clean", run: "gradle clean", terminal: true, icon: gradle }

  # Per-project `gradle :path:build` for each project a settings file includes.
  - id: gradle-modules
    match: [settings.gradle, settings.gradle.kts]
    provider: gradle-modules
    requires: [gradle]

  - id: flutter
    match: pubspec.yaml
    requires: [flutter]
    actions:
      - { name: "flutter pub get", run: "flutter pub get", terminal: true, icon: flutter }
      - { name: "flutter run", run: "flutter run", terminal: true, icon: flutter }
      - { name: "flutter build apk", run: "flutter build apk", terminal: true, icon: flutter }
      - { name: "flutter test", run: "flutter test", terminal: true, icon: flutter }

  # Flutter's Android build lives in android/, one level below the project —
  # reaches in for it directly rather than through the generic per-project scan.
  - id: flutter-android
    match: pubspec.yaml
    provider: flutter-android

  - id: cmake
    match: CMakeLists.txt
    requires: [cmake]
    actions:
      - { name: "cmake configure", run: "cmake -B build", terminal: true, icon: cmake }
      - { name: "cmake build", run: "cmake --build build", terminal: true, icon: cmake }

  - id: bundler
    match: Gemfile
    requires: [bundle]
    actions:
      - { name: "bundle install", run: "bundle install", terminal: true, icon: ruby }

  - id: mix
    match: mix.exs
    requires: [mix]
    actions:
      - { name: "mix deps.get", run: "mix deps.get", terminal: true, icon: elixir }
      - { name: "mix compile", run: "mix compile", terminal: true, icon: elixir }
      - { name: "mix test", run: "mix test", terminal: true, icon: elixir }

  - id: composer
    match: composer.json
    requires: [composer]
    actions:
      - { name: "composer install", run: "composer install", terminal: true, icon: php }
      - { name: "composer update", run: "composer update", terminal: true, icon: php }

  - id: deno
    match: [deno.json, deno.jsonc]
    requires: [deno]
    actions:
      - { name: "deno task", run: "deno task", terminal: true, icon: deno }
      - { name: "deno test", run: "deno test", terminal: true, icon: deno }
      - { name: "deno cache", run: "deno cache .", terminal: true, icon: deno }

  - id: nix-flake
    match: flake.nix
    requires: [nix]
    actions:
      - { name: "nix develop", run: "nix develop", terminal: true, icon: nix }
      - { name: "nix build", run: "nix build", terminal: true, icon: nix }
      - { name: "nix flake check", run: "nix flake check", terminal: true, icon: nix }

  - id: nix-shell
    match: shell.nix
    requires: [nix-shell]
    actions:
      - { name: "nix-shell", run: "nix-shell", terminal: true, icon: nix }

  - id: docker-image
    match: Dockerfile
    scope: repo
    requires: [docker]
    actions:
      - { name: "docker build", run: "docker build -t {{name}} .", terminal: true, icon: docker }

  # --- Eclipse-family IDEs ------------------------------------------------
  # `-data <dir>` opens that dir as the WORKSPACE. One-click when the scanned
  # folder is (or becomes) the workspace; otherwise Studio opens an empty
  # workspace and you import once (File > Open Projects from File System).
  # A configured default-workspace + metadata seeding is a later milestone.
  - id: eclipse-project
    match: [".project", "mule-artifact.json"]
    actions:
      - name: "Open in Anypoint Studio"
        program: "{{anypoint}}"
        args: ["-data", "{{path}}"]
        needs: [anypoint]
        icon: eclipse
      - name: "Open in Eclipse"
        program: "{{eclipse}}"
        args: ["-data", "{{path}}"]
        needs: [eclipse]
        icon: eclipse
      - name: "Open in Spring Tool Suite"
        program: "{{sts}}"
        args: ["-data", "{{path}}"]
        needs: [sts]
        icon: eclipse

# --- universal actions -------------------------------------------------
# The first four work on every system; everything below is an app that may or
# may not be installed (and is hidden via `needs:` when it isn't). Grouped:
# AI CLIs, then AI editors, then editors/IDEs, then git tools.
universal:
  default: terminal
  actions:
    - { id: terminal, name: "Open in terminal", terminal: true, icon: terminal }
    - { id: filemanager, name: "Reveal in file manager", program: "{{filemanager}}", args: ["{{path}}"], icon: folder }
    - { id: copy-path, name: "Copy path", client: true, icon: copy }
    - { id: run-command, name: "Run command…", prompt: true, terminal: true, icon: run }

    # AI coding CLIs (terminal agents), alphabetical. `icon:` names the intended
    # brand key even where no glyph ships yet — it lights up if one is added.
    - { id: aider, name: "Launch Aider", terminal: true, run: "aider", needs: [aider], icon: aider }
    - { id: amazon-q, name: "Launch Amazon Q", terminal: true, run: "q chat", needs: [amazonq], icon: amazonq }
    - { id: claude-code, name: "Launch Claude Code", terminal: true, run: "claude", needs: [claude], icon: claude }
    - { id: codex, name: "Launch Codex", terminal: true, run: "codex", needs: [codex], icon: codex }
    - { id: crush, name: "Launch Crush", terminal: true, run: "crush", needs: [crush], icon: crush }
    - { id: cursor-agent, name: "Launch Cursor Agent", terminal: true, run: "cursor-agent", needs: [cursoragent], icon: cursor }
    - { id: gemini, name: "Launch Gemini CLI", terminal: true, run: "gemini", needs: [gemini], icon: gemini }
    - { id: github-copilot, name: "Launch GitHub Copilot CLI", terminal: true, run: "copilot", needs: [copilot], icon: copilot }
    - { id: goose, name: "Launch Goose", terminal: true, run: "goose", needs: [goose], icon: goose }
    - { id: opencode, name: "Launch opencode", terminal: true, run: "opencode", needs: [opencode], icon: opencode }
    - { id: qwen, name: "Launch Qwen Code", terminal: true, run: "qwen", needs: [qwen], icon: qwen }

    # AI editors (GUI), alphabetical.
    - { id: cursor, name: "Open in Cursor", program: "{{cursor}}", args: ["{{path}}"], needs: [cursor], icon: cursor }
    - { id: trae, name: "Open in Trae", program: "{{trae}}", args: ["{{path}}"], needs: [trae], icon: trae }
    - { id: windsurf, name: "Open in Windsurf", program: "{{windsurf}}", args: ["{{path}}"], needs: [windsurf], icon: windsurf }

    # Editors / IDEs, alphabetical.
    - { id: goland, name: "Open in GoLand", program: "{{goland}}", args: ["{{path}}"], needs: [goland], icon: goland }
    - { id: idea, name: "Open in IntelliJ IDEA", program: "{{idea}}", args: ["{{path}}"], needs: [idea], icon: intellij }
    - { id: lapce, name: "Open in Lapce", program: "{{lapce}}", args: ["{{path}}"], needs: [lapce], icon: lapce }
    - { id: pulsar, name: "Open in Pulsar", program: "{{pulsar}}", args: ["{{path}}"], needs: [pulsar], icon: code }
    - { id: pycharm, name: "Open in PyCharm", program: "{{pycharm}}", args: ["{{path}}"], needs: [pycharm], icon: pycharm }
    - { id: sublime, name: "Open in Sublime Text", program: "{{subl}}", args: ["{{path}}"], needs: [subl], icon: sublime }
    - { id: vscode, name: "Open in VS Code", program: "{{code}}", args: ["{{path}}"], needs: [code], icon: vscode }
    - { id: vscodium, name: "Open in VSCodium", program: "{{codium}}", args: ["{{path}}"], needs: [codium], icon: vscodium }
    - { id: webstorm, name: "Open in WebStorm", program: "{{webstorm}}", args: ["{{path}}"], needs: [webstorm], icon: webstorm }
    - { id: zed, name: "Open in Zed", program: "{{zed}}", args: ["{{path}}"], needs: [zed], icon: zed }

    # Git GUIs / TUIs.
    - { id: fork, name: "Open in Fork", program: "{{fork}}", args: ["{{path}}"], needs: [fork], icon: git }
    - { id: gitkraken, name: "Open in GitKraken", program: "{{gitkraken}}", args: ["-p", "{{path}}"], needs: [gitkraken], icon: gitkraken }
    - { id: sublime-merge, name: "Open in Sublime Merge", program: "{{smerge}}", args: ["{{path}}"], needs: [smerge], icon: git }
    - { id: lazygit, name: "lazygit", run: "lazygit", terminal: true, needs: [lazygit], icon: git }

# Flatpak manifest for dev-prompt.
#
# Status: written, not yet built end-to-end (no flatpak-builder on the dev box).
# Before the first Flathub submission:
#   1. Generate the offline dependency sources (see packaging/flatpak/README.md):
#        cargo-sources.json   <- flatpak-cargo-generator src-tauri/Cargo.lock
#        node-sources.json    <- flatpak-node-generator npm package-lock.json
#   2. Pin the libayatana-appindicator module (sha256s) from flathub/shared-modules.
#   3. flatpak-builder --user --install --force-clean build-dir <this file>
#      and smoke-test: tray, hotkey (portal), launching a host editor/terminal.
#
# Sandbox rationale for the reviewer:
#   dev-prompt is a launcher. It reads the git repos under the user's code
#   folders (--filesystem=home) and opens them in the user's editor / terminal /
#   CLI on the host (--talk-name=org.freedesktop.Flatpak for `flatpak-spawn
#   --host`). It never writes outside its own data dir. No --share=network: the
#   in-app updater is compiled-in but disabled under Flatpak (updates come from
#   `flatpak update`).
app-id: io.github.seraphx2.devprompt
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: dev-prompt

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Launch host programs (editors, terminals, AI CLIs) via `flatpak-spawn --host`.
  - --talk-name=org.freedesktop.Flatpak
  # System-tray icon (SNI) and desktop notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Discover the user's repositories. Also gives the ">" app scope the user's
  # ~/.local/share[/flatpak/exports]/applications entries; system apps under
  # /usr/share would need --filesystem=host:ro and aren't worth that here.
  - --filesystem=home
  # Global hotkey goes through org.freedesktop.portal.GlobalShortcuts (part of
  # the always-available Desktop portal). Falls back to the tray if the portal
  # or the plugin can't register it.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/dev-prompt/cargo
    # Vite/rollup: keep the build hermetic.
    npm_config_offline: 'true'

modules:
  # --- tray backend -------------------------------------------------------
  # libayatana-appindicator + its libdbusmenu / libayatana-indicator deps.
  # Pull the pinned versions from https://github.com/flathub/shared-modules
  # (module set: "libappindicator/libappindicator-gtk3-12.10.json") or vendor
  # the three ayatana tarballs here with sha256s.
  # TODO(phase 4): add the concrete module before the Flathub PR.
  # - shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  # --- the app ----------------------------------------------------------
  - name: dev-prompt
    buildsystem: simple
    sources:
      - type: dir
        path: ../..            # repo root
      # Generated — see packaging/flatpak/README.md. Not committed until first build.
      # - cargo-sources.json
      # - node-sources.json
    build-commands:
      - npm ci --offline
      - npm run build                       # vite -> dist/ (embedded by tauri-build)
      - cargo build --release --offline --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/dev-prompt -t /app/bin
      # Desktop entry + metainfo, rebased to the Flatpak app-id.
      - |
        install -Dm644 packaging/linux/dev-prompt.desktop \
          /app/share/applications/io.github.seraphx2.devprompt.desktop
        sed -i 's/^Icon=dev-prompt$/Icon=io.github.seraphx2.devprompt/' \
          /app/share/applications/io.github.seraphx2.devprompt.desktop
      - |
        install -Dm644 packaging/linux/io.github.seraphx2.devprompt.metainfo.xml \
          /app/share/metainfo/io.github.seraphx2.devprompt.metainfo.xml
        sed -i 's|>dev-prompt.desktop<|>io.github.seraphx2.devprompt.desktop<|' \
          /app/share/metainfo/io.github.seraphx2.devprompt.metainfo.xml
      # Icons — Tauri's PNG set lives in src-tauri/icons/ (32, 128, 128@2x, and
      # icon.png at 512).
      - install -Dm644 src-tauri/icons/32x32.png     /app/share/icons/hicolor/32x32/apps/io.github.seraphx2.devprompt.png
      - install -Dm644 src-tauri/icons/128x128.png   /app/share/icons/hicolor/128x128/apps/io.github.seraphx2.devprompt.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.seraphx2.devprompt.png
      - install -Dm644 src-tauri/icons/icon.png       /app/share/icons/hicolor/512x512/apps/io.github.seraphx2.devprompt.png

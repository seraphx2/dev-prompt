[package]
name = "dev-prompt"
version = "0.1.0"
description = "Cross-platform command-palette overlay for launching dev repositories"
authors = ["seraphx2"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dev_prompt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"

ignore = "0.4"
globset = "0.4"
glob = "0.3"
nucleo-matcher = "0.3"
dirs = "6"
anyhow = "1"
thiserror = "2"
# Watches the roots so repos created or removed outside dev-prompt show up
# without a rescan (watch.rs).
notify = "8"
# Moves removed folders to the Recycle Bin / Trash, and restores them (Undo).
trash = "5"
portable-pty = "0.9.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# XDG Background portal — login autostart from inside the Flatpak sandbox, where
# tauri-plugin-autostart can't write ~/.config/autostart. Uses the tokio runtime
# Tauri already runs on. `zbus` is already in the tree via the GTK stack.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "background"] }
# Wayland: the overlay as a centred layer-shell surface (layer.rs). gtk-layer-shell
# is dlopen'd at runtime — an optional dependency, not a link-time one — and the
# window pointer comes from the same gtk 0.18 Tauri uses.
gtk = "0.18"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
raw-window-handle = "0.6"
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    # Registry change notifications for the app watcher (app_watch.rs).
    "Win32_Foundation",
    "Win32_Security", # CreateEventW takes SECURITY_ATTRIBUTES
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[profile.dev]
incremental = true
# Windows linking is dominated by debuginfo size; line tables keep panic
# locations readable while cutting the link step for `cargo build`/`clippy`.
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

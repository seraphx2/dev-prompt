name: CI — Rust
description: >
  Clippy (-D warnings) and the cargo test suite on Windows. Builds the frontend
  bundle first because `tauri::generate_context!` embeds dist/. Assumes the repo
  is already checked out.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        cache-on-failure: "true"

    - name: Build frontend bundle (embedded by generate_context!)
      shell: bash
      run: npm ci && npx vite build

    - name: Clippy
      shell: bash
      working-directory: src-tauri
      run: cargo clippy --all-targets -- -D warnings

    - name: Tests
      shell: bash
      working-directory: src-tauri
      run: cargo test

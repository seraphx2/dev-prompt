name: CI (dev)

# Per-commit coverage on the long-lived dev branch, so a break is pinned to
# the commit that caused it instead of surfacing across a whole delta at PR
# time. Separate workflow (not the `check` context) so it never touches the
# dev->main PR gate. Skips doc-only pushes.
on:
  push:
    branches: [dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-frontend

  # Linux for speed — see the note in ci.yml. Windows compile is covered by
  # local dev and release.yml.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-rust

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-packaging

# Dependabot version updates. Each ecosystem is grouped, so a run opens at most
# one PR per ecosystem (plus stragglers that can't be grouped). PRs target `dev`
# — the default branch and where CI (`ci-dev.yml`) runs. Security alerts are a
# separate repo setting and open PRs only for actual advisories.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      npm:
        patterns:
          - "*"
    # Majors (Svelte, Vite, Tauri CLI, …) tend to need code changes — take those
    # by hand; grouped minor/patch keep the lockfile fresh in the meantime.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: "/src-tauri"
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
